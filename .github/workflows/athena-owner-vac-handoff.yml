name: Athena owner VAC handoff tests
on:
  pull_request:
    paths:
      - vac-vault-handoff.js
      - vac-reauth-ceremony.js
      - tests/vault-handoff.test.js
      - tests/digit-readiness.test.js
      - tests/face-stage-gate.test.js
      - tests/mic-cold-start.test.js
      - tests/voice-content-gate.test.js
      - tests/prompt-state.test.js
      - tests/narration-review-layout.cjs
      - tests/ceremony-post-progress.test.js
      - test_vault_full_face_capture.node.js
      - .github/workflows/athena-owner-vac-handoff.yml
  push:
    branches:
      - feature/athena-owner-collaborate-vac-handoff-20261103
jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out test source
        uses: actions/checkout@v4
      - name: Verify Node version
        run: node --version
      - name: Run cross-origin VAC handoff and terminal face-capture regression tests
        run: |
          node --test tests/vault-handoff.test.js tests/ceremony-post-progress.test.js tests/digit-readiness.test.js tests/face-stage-gate.test.js tests/mic-cold-start.test.js tests/voice-content-gate.test.js tests/prompt-state.test.js
          node test_vault_full_face_capture.node.js
  narration-layout:
    name: Offline narration results layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out test source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser harness
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check simulated narration layout at three viewport sizes
        env:
          VAC_LAYOUT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/narration-review-layout.cjs
      - name: Save simulated screenshots and layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narration-review-layout
          path: artifacts/narration-review-layout
          if-no-files-found: warn
          retention-days: 14

