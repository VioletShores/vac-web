name: auth-fork-guard
on:
  push: { paths: ['vac-reauth-ceremony.js', 'auth.html', 'tests/**'] }
  pull_request: { paths: ['vac-reauth-ceremony.js', 'auth.html', 'tests/**'] }
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-auth-single-path.sh
      - run: node --check vac-reauth-ceremony.js
      - run: node --test tests/vad-replay.test.js
      - run: node --test tests/zone-geometry.test.js
      - run: node --test tests/prompt-state.test.js
      - run: node --test tests/voice-content-gate.test.js
      - run: node --test tests/ceremony-conformance.test.js
