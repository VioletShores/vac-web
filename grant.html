<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0F1A">
<title>VAC — Grant Merge Authority</title>
<style>
:root{
  --bg:#0A0F1A; --surface:#111826; --surface-raised:#161F31; --border:#232E42; --border-light:#2E3B54;
  --text:#E8EDF5; --text-dim:#93A1B8; --text-quiet:#5E6B82;
  --gold:#C9A227; --gold-bg:rgba(201,162,39,0.08); --gold-border:rgba(201,162,39,0.3);
  --red:#EF4444; --red-bg:rgba(239,68,68,0.08); --red-border:rgba(239,68,68,0.3);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'SF Mono',SFMono-Regular,Menlo,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);}
.page-shell{background:var(--bg)!important;min-height:100vh;color:var(--text-dim);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 60px;}
.wrap{max-width:520px;margin:0 auto;padding:0 20px;}
a{color:var(--gold);}

header.top{border-bottom:1px solid var(--border);padding:20px 0;margin-bottom:40px;}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:12px;}
.mark{width:32px;height:32px;flex:0 0 32px;}
.brand-name{font-weight:700;color:var(--text);font-size:16px;letter-spacing:-0.2px;}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--text-quiet);letter-spacing:1px;}
.nav-mode{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:5px;letter-spacing:0.5px;font-weight:600;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-border);}

h1{font-size:19px;color:var(--text);font-weight:700;letter-spacing:-0.3px;margin-bottom:6px;}
.eyebrow{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}
.p{font-size:13.5px;color:var(--text-dim);line-height:1.6;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:8px;}
.scope-list{list-style:none;margin:16px 0;padding:0;font-family:var(--mono);font-size:12.5px;color:var(--text-dim);}
.scope-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);}
.scope-list li:last-child{border-bottom:none;}
.scope-list .k{color:var(--text-quiet);}
.scope-list .v{color:var(--text);text-align:right;}

.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:18px;font-family:var(--font);}
.btn-gold{background:var(--gold);color:#181205;}
.btn-gold:hover:not(:disabled){background:#B8952A;}
.btn-gold:disabled{opacity:0.5;cursor:not-allowed;}

.gate-msg{background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text-dim);margin-bottom:16px;}
.gate-msg strong{color:var(--gold);}

.expiry-note{background:var(--surface);border:1px solid var(--gold-border);border-left:3px solid var(--gold);border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--text);line-height:1.55;margin-bottom:14px;}
.expiry-note .expiry-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}

.jti-box{background:#080C15;border:1px solid var(--border-light);border-radius:8px;padding:14px 16px;margin:16px 0 6px;word-break:break-all;font-family:var(--mono);font-size:16px;color:var(--text);}
.copy-btn{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:transparent;border:1px solid var(--border-light);border-radius:6px;padding:6px 12px;cursor:pointer;margin-bottom:14px;}
.copy-btn:hover{color:var(--text);border-color:var(--gold-border);}
.copy-btn.copied{color:var(--gold);border-color:var(--gold-border);}

.verify-link{display:block;font-family:var(--mono);font-size:12.5px;margin-top:4px;word-break:break-all;}

.warn-box{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;margin:16px 0;font-size:13px;color:#FCA5A5;font-weight:600;}

.err-box{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;font-size:13px;color:#FCA5A5;font-family:var(--mono);word-break:break-word;}

.attest-list{list-style:none;margin:14px 0 0;padding:0;font-family:var(--mono);font-size:12px;color:var(--text-quiet);}
.attest-list li{display:flex;justify-content:space-between;padding:4px 0;}
.attest-list .v{color:var(--text-dim);}

.candidate-list{list-style:none;margin:14px 0 0;padding:0;}
.candidate-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--text-dim);cursor:pointer;}
.candidate-row:last-child{border-bottom:none;}
.candidate-row-greyed{opacity:0.5;}
.candidate-branch{color:var(--text);font-weight:600;}
.candidate-sha{color:var(--text-quiet);}
.candidate-pr{color:var(--text-dim);}
.candidate-verdict{margin-left:auto;text-transform:uppercase;font-size:10px;letter-spacing:0.5px;}
.candidate-reason{width:100%;color:var(--text-quiet);font-size:11px;}

.repo-group-header{font-family:var(--mono);font-size:10px;color:var(--text-quiet);letter-spacing:1px;text-transform:uppercase;padding:10px 0 4px;border-bottom:1px solid var(--border-light);margin-top:8px;}
.select-all-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px;gap:8px;}
.select-all-btn{font-family:var(--mono);font-size:11px;color:var(--gold);background:transparent;border:1px solid var(--gold-border);border-radius:6px;padding:5px 12px;cursor:pointer;}
.select-all-btn:hover{background:var(--gold-bg);}
.candidate-count{font-family:var(--mono);font-size:11px;color:var(--text-quiet);}

.loading-state{display:flex;align-items:center;gap:10px;padding:16px 0;font-family:var(--mono);font-size:12px;color:var(--text-quiet);}
.loading-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:ldot 1.4s ease-in-out infinite;}
.loading-dot:nth-child(2){animation-delay:.2s;}
.loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes ldot{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

.note{font-family:var(--mono);font-size:11px;color:var(--text-quiet);line-height:1.6;margin-top:16px;}
</style>
</head>
<body>
<div class="page-shell">
  <header class="top"><div class="wrap"><div class="top-row">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#C9A227" stroke-width="1.5"/><path d="M20 8 L20 32 M11 14 L29 26 M29 14 L11 26" stroke="#B8952A" stroke-width="1.2" opacity="0.55"/><circle cx="20" cy="20" r="4.5" fill="#C9A227"/></svg>
      <div><div class="brand-name">VAC Protocol</div><div class="brand-sub">VERIFIABLE AUTHORITY CHAIN</div></div>
    </div>
    <span class="nav-mode">GRANT</span>
  </div></div></header>

  <div class="wrap">
    <div class="eyebrow">Athena permit v1</div>
    <h1 id="pageTitle">Grant merge authority</h1>
    <div id="stage"></div>
    <div class="note" id="explainNote"></div>
  </div>
</div>

<script src="/vac-auth.js"></script>
<script>
'use strict';
var API_BASE = 'https://vac-system-production.up.railway.app';
var ATHENA_API = 'https://api.athenapilot.ai';
var RETURN_PATH = '/grant';
var REPO_RESOURCE = 'repo:VioletShores/athena';
// S176: ?repo= controls which repos' candidates are loaded.
// No param → both fleet repos shown grouped. One param → single-repo view.
var FLEET_REPOS = ['VioletShores/athena', 'VioletShores/vac-web'];
var _urlParams = new URLSearchParams(window.location.search);
var _repoParam = (_urlParams.get('repo') || '').trim();

var stageEl = document.getElementById('stage');
var explainEl = document.getElementById('explainNote');

function setExplain(text) { explainEl.textContent = text; }

// ============================================================
// Pure, testable helpers (no DOM access) — see tests/grant-page.test.js
// ============================================================

// Builds the POST body for /v1/vat/issue per the IssueVATReq schema. `token` is the raw
// session token string; it is placed on the request only, never rendered by any caller.
function buildIssueBody(user, token) {
  return {
    human_identity: user.email,
    agent_id: 'athena-merge-lane',
    resources: ['repo:VioletShores/athena'],
    actions: ['merge'],
    verification_method: 'multi_modal',
    expiry_seconds: 86400,
    max_depth: 1,
    sensitivity: 'high',
    context: { surface: 'grant', purpose: 'athena permit v1 merge scope' },
    authorising_session_token: token
  };
}

// A minted token only counts as trustworthy if the server itself attests to a full-tier
// ceremony — a client-asserted or non-server attestation must render as untrusted. When the
// response carries an explicit vac_assurance_level, it must be L3; older responses that don't
// carry the field at all are treated as trusted on attestation alone (fallback for compatibility).
function isServerAttestedFull(vacAuthorisation, vacAssuranceLevel) {
  return !!vacAuthorisation &&
    vacAuthorisation.attested_by === 'server' &&
    vacAuthorisation.auth_level === 'full' &&
    (vacAssuranceLevel === undefined || vacAssuranceLevel === null || vacAssuranceLevel === 'L3');
}

// The by-vat permit only counts as rooted in a human if the fleet's own response says so —
// anything else (service-issued, unknown) must render as a warning rather than a quiet pass.
// The fleet's literal is 'human-rooted' (backend/permits.py _authority_class: 'human-rooted' |
// 'shared-secret'). D-GRANT-PAGE-RESULT-PATHS: this page compared against 'human_rooted'
// (underscore), so every genuine human-rooted permit tripped the red banner while printing
// "human-rooted" beside it. Hyphen and underscore spellings are both accepted; nothing else is.
function isHumanRootedAuthority(authorityClass) {
  return String(authorityClass || '').replace(/_/g, '-') === 'human-rooted';
}

// The live by-vat route returns { permit: {id, expires_at, authority_class, ...}, authority_class,
// vac_verdict, receipt } — id and expires_at live INSIDE permit. D-GRANT-PAGE-RESULT-PATHS: the
// page read them at the top level and rendered "(none)" / "(unknown)". Pure: reads the nested
// permit first, falls back to top-level fields for any older/flattened shape.
function permitResultFields(data) {
  data = data || {};
  var permit = (data.permit && typeof data.permit === 'object') ? data.permit : {};
  return {
    id: permit.id || data.id || '',
    expiresAt: permit.expires_at || data.expires_at || '',
    authorityClass: data.authority_class || permit.authority_class || ''
  };
}

// Expiry narration (ceremony UX bundle): when this page finds a PRIOR authority on the device
// that no longer validates, say why in plain words instead of the bare "no session found".
// `prior` is a snapshot of what was stored (see priorAuthoritySnapshot); `now` is passed in so
// this stays pure. Returns '' when there was nothing to narrate.
var AUTHORITY_TTL_MS = 24 * 60 * 60 * 1000;
function expiryNarration(prior, now) {
  if (!prior || !prior.had) return '';
  var aged = typeof prior.ts === 'number' && prior.ts > 0 && (now - prior.ts) > AUTHORITY_TTL_MS;
  var lead = aged
    ? 'Your previous authority expired after 24 hours.'
    : 'Your previous authority is no longer valid.';
  return lead + ' Quick renewal is not yet enabled, so a full ceremony is required.';
}

// Reads the stored ceremony result timestamps without touching the token. Pure over the
// provided storage-like object (get(key) -> string|null) so tests can feed it fixtures.
function priorAuthoritySnapshot(store) {
  var had = false, ts = 0;
  function readTs(key, field) {
    var raw = null;
    try { raw = store.getItem(key); } catch (e) { raw = null; }
    if (!raw) return;
    had = true;
    try {
      var obj = JSON.parse(raw);
      var t = obj && obj[field];
      if (typeof t === 'number' && t > ts) ts = t;
    } catch (e) {}
  }
  readTs('vac_verified', 'timestamp');
  readTs('vac_last_verified', 'ts');
  try { if (store.getItem('vac_session')) had = true; } catch (e) {}
  return { had: had, ts: ts };
}

// Builds the POST body for /v1/mac/authorizations/by-vat. `vat` is the compact_jwt from the
// mint response, placed on the request only — see the in-memory-only handling around
// renderGrantCard/grantAuthority; it must never reach localStorage or the DOM. `nowIso` is
// passed in (rather than read via `new Date()` inside) so this stays a pure, testable function.
// `branches` is the caller-supplied {name, sha} list — content-bound per F-1205 slice 3; the
// caller (grantAuthority) is responsible for never invoking this with an empty list, since the
// API correctly refuses a wildcard/empty branches array.
function buildGrantBody(user, vat, branches, nowIso) {
  return {
    vat: vat,
    repo: 'VioletShores/athena',
    branches: branches,
    reason: 'granted from /grant by ' + user.email + ' ' + nowIso
  };
}

// ============================================================
// Session bridge — the production full ceremony (auth.html, top-level tab) persists its
// result to localStorage('vac_verified' / 'vac_last_verified'), NOT to vac-auth.js's own
// 'vac_session' key (the two are separate stores; auth.html is frozen and out of scope to
// change). If vac-auth.js has no session yet, copy a ceremony result across so VAC.getToken()
// / VAC.isAuthenticated() work as the single source of truth from here on. The bridged token
// is then re-validated server-side below — this step only decides what to validate.
// ============================================================
function bridgeCeremonySession() {
  try {
    if (localStorage.getItem('vac_session')) return;
  } catch (e) { return; }

  var token = null, email = '', name = '';
  try {
    var lv = JSON.parse(localStorage.getItem('vac_last_verified') || 'null');
    if (lv && lv.session_token) { token = lv.session_token; email = lv.email || ''; name = lv.name || ''; }
  } catch (e) {}

  if (!token) {
    try {
      var vv = JSON.parse(localStorage.getItem('vac_verified') || 'null');
      if (vv && vv.authResult) {
        var sess = vv.authResult.session || null;
        token = vv.authResult.session_token || (sess && sess.token) || null;
        email = vv.email || '';
        name = vv.name || '';
      }
    } catch (e) {}
  }

  if (token) {
    try {
      localStorage.setItem('vac_session', token);
      localStorage.setItem('vac_user', JSON.stringify({ email: email, name: name }));
    } catch (e) {}
  }
}

// ============================================================
// Render states
// ============================================================

function renderGate(insufficientTier, narration) {
  var authUrl = '/auth?return=' + encodeURIComponent(RETURN_PATH);
  var msg = insufficientTier
    ? 'Your session isn’t full-tier. Quick re-auth is not accepted here — minting merge authority requires your own full verification ceremony (identity + live biometric).'
    : 'No verified session found. Minting merge authority requires your own full verification ceremony (identity + live biometric) — quick tier is not acceptable.';
  var narrationHtml = narration
    ? '<div class="expiry-note" id="expiryNote"><span class="expiry-label">Previous authority</span>' + escapeHtml(narration) + '</div>'
    : '';
  stageEl.innerHTML =
    narrationHtml +
    '<div class="gate-msg"><strong>Full ceremony required.</strong> ' + msg + '</div>' +
    '<button class="btn btn-gold" id="startCeremonyBtn" type="button">Start full verification</button>' +
    '<div class="note">After verifying, use the “← Back to the demo” link at the top of that page to return here — the button at the bottom of that page goes elsewhere.</div>';
  document.getElementById('startCeremonyBtn').addEventListener('click', function () {
    window.location.href = authUrl;
  });
  setExplain(narration
    ? 'This page found a previous authority on this device that no longer validates. Quick renewal is not yet enabled, so it is sending you to the full biometric ceremony instead of minting anything.'
    : 'This page checked your VAC session and found none at full tier, so it sent you to the full biometric ceremony instead of minting anything.');
}

function renderMintCard(user) {
  stageEl.innerHTML =
    '<div class="card">' +
      '<div style="font-weight:700;color:#E8EDF5;font-size:16px;margin-bottom:14px;">Mint merge authority for VioletShores/athena</div>' +
      '<ul class="scope-list">' +
        '<li><span class="k">actions</span><span class="v">merge</span></li>' +
        '<li><span class="k">resources</span><span class="v">' + REPO_RESOURCE + '</span></li>' +
        '<li><span class="k">expiry</span><span class="v">24h</span></li>' +
        '<li><span class="k">max_depth</span><span class="v">1</span></li>' +
      '</ul>' +
      '<button class="btn btn-gold" id="mintBtn" type="button">Mint merge-scope VRT</button>' +
    '</div>';
  document.getElementById('mintBtn').addEventListener('click', function () { mintToken(user); });
  setExplain('This page verified you hold a full-tier VAC session for ' + user.email + ' and is ready to mint a 24h merge-scope VRT (Verifiable Root Token) bound to that identity — your session token is read in-browser and sent only inside the signed mint request, never shown or logged.');
}

function renderResult(data, user) {
  var jti = data.jti || '';
  var verifyUrl = data.verify_url || (jti ? ('/vat/verify/' + jti + '?intent=verify') : '');
  // Two conflicting claims exist about where /v1/vat/issue nests the ceremony attestation:
  // commit 6b19d1b (this repo, two commits back) fixed an *observed* false-not-L3 render bug
  // by reading claims.context.vac_authorisation; this task packet asserts that was wrong and
  // the real path is claims.vac_context.vac_authorisation, with no reproduction evidence given.
  // Unresolved — read both nested shapes (new claim first) plus the top-level fallback so the
  // trust gate (and the by-vat grant flow gated on it) keeps working under either shape. Flagged
  // for the orchestrator/reviewer to confirm against the live response before merge.
  var claims = data.claims || {};
  var vacAuth = (claims.vac_context && claims.vac_context.vac_authorisation) ||
    (claims.context && claims.context.vac_authorisation) || data.vac_authorisation || {};
  var assuranceLevel = claims.vac_assurance_level;
  var trusted = isServerAttestedFull(vacAuth, assuranceLevel);

  var html = '<div class="card">' +
    '<div style="font-weight:700;color:#E8EDF5;font-size:16px;margin-bottom:4px;">Merge-scope VRT minted</div>';

  if (!trusted) {
    html += '<div class="warn-box">not L3 - re-run the full ceremony</div>';
  }

  html += '<div class="jti-box" id="jtiBox">' + escapeHtml(jti || '(no jti returned)') + '</div>';
  if (trusted && jti) {
    html += '<button class="copy-btn" id="copyJtiBtn" type="button">Copy jti</button>';
  }
  var safeVerifyUrl = sanitizeHref(verifyUrl);
  if (safeVerifyUrl) {
    html += '<a class="verify-link" href="' + safeVerifyUrl + '" target="_blank" rel="noopener">' + escapeHtml(verifyUrl) + '</a>';
  }
  html += '<ul class="attest-list">' +
    '<li><span class="k">attested_by</span><span class="v">' + escapeHtml(String(vacAuth.attested_by || '(none)')) + '</span></li>' +
    '<li><span class="k">auth_level</span><span class="v">' + escapeHtml(String(vacAuth.auth_level || '(none)')) + '</span></li>' +
    '<li><span class="k">vac_assurance_level</span><span class="v">' + escapeHtml(String(assuranceLevel || '(none)')) + '</span></li>';
  if (vacAuth.assurance_basis) {
    html += '<li><span class="k">assurance_basis</span><span class="v">' + escapeHtml(String(vacAuth.assurance_basis)) + '</span></li>';
  }
  html += '</ul>';
  html += '</div>';

  stageEl.innerHTML = html;

  var copyBtn = document.getElementById('copyJtiBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        copyBtn.textContent = 'Copy unavailable';
        return;
      }
      navigator.clipboard.writeText(jti).then(function () {
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(function () { copyBtn.textContent = 'Copy jti'; copyBtn.classList.remove('copied'); }, 1500);
      }).catch(function () {});
    });
  }

  setExplain('This page minted a 24h merge-scope VRT for VioletShores/athena and is showing the server’s own attestation of the ceremony — it never renders your session token, only the jti the server returned.');

  // The compact_jwt lives only in this closure from here on — passed into renderGrantCard
  // and then grantAuthority/buildGrantBody, never assigned to a module-level variable,
  // never written to localStorage, never rendered.
  if (trusted && data.compact_jwt) {
    renderGrantCard(user, data.compact_jwt);
  }
}

function renderMintError(message) {
  stageEl.innerHTML = '<div class="err-box">Mint failed: ' + escapeHtml(message) + '</div>' +
    '<button class="btn btn-gold" id="retryBtn" type="button">Try again</button>';
  document.getElementById('retryBtn').addEventListener('click', checkSessionAndRender);
  setExplain('The mint request to /v1/vat/issue failed — nothing was granted.');
}

// ============================================================
// Second tap: by-vat merge permit, content-bound to merge-candidates (F-1205 slice 3)
// ============================================================

// Pure: the live /v1/mac/merge-candidates route nests the gate result at gates.status
// ('passed'|'failed'|'unknown'); gates.verdict is kept as a fallback for any older/other
// shape that still uses that key. Missing/unknown gates always resolve to 'unknown'.
function gatesStatus(gates) {
  gates = gates || {};
  return gates.status || gates.verdict || 'unknown';
}

// Pure: a candidate is ready to preselect when the route says so directly (ready: true) or,
// failing that, when its gates resolve to 'passed' — 'unknown'/'failed'/missing must all
// default to unchecked so a candidate is never preselected without a passing signal.
function isCandidateReady(candidate) {
  candidate = candidate || {};
  return candidate.ready === true || gatesStatus(candidate.gates) === 'passed';
}

function shortSha(sha) {
  return String(sha || '').slice(0, 7);
}

// Builds one candidate row's HTML. Pure/testable — string building only, no DOM access.
// data-name/data-sha/data-repo on the checkbox are what grantAuthority reads back to
// build the per-repo {name, sha} pairs for the POST body; they must be the exact values
// the fleet compared against, not a re-derived shortSha. `name` falls back to `branch`
// for compatibility with an older shape; `pr` is a bare number on the live route.
// S176: `repo` field added to each candidate by the backend — carried here as data-repo.
function candidateRowHtml(candidate) {
  var name = String(candidate.name || candidate.branch || '');
  var sha = String(candidate.sha || '');
  var repo = String(candidate.repo || '');
  var pr = candidate.pr;
  var title = candidate.title || '';
  var gates = candidate.gates || {};
  var status = gatesStatus(gates);
  var ready = isCandidateReady(candidate);
  var rowClass = ready ? 'candidate-row' : 'candidate-row candidate-row-greyed';
  var prLabel = pr ? ('#' + pr + (title ? ' ' + title : '')) : '(no PR)';

  var html = '<label class="' + rowClass + '">' +
    '<input type="checkbox" class="candidate-checkbox" data-name="' + escapeHtml(name) +
    '" data-sha="' + escapeHtml(sha) + '" data-repo="' + escapeHtml(repo) + '"' +
    (ready ? ' checked' : '') + '>' +
    '<span class="candidate-branch">' + escapeHtml(name) + '</span>' +
    '<span class="candidate-sha">' + escapeHtml(shortSha(sha)) + '</span>' +
    '<span class="candidate-pr">' + escapeHtml(prLabel) + '</span>' +
    '<span class="candidate-verdict">' + escapeHtml(status) + '</span>';
  if (!ready && gates.reason) {
    html += '<span class="candidate-reason">' + escapeHtml(String(gates.reason)) + '</span>';
  }
  html += '</label>';
  return html;
}

// Builds the full candidate-list HTML from a candidates array (may be multi-repo).
// Pure/testable. When candidates carry a `repo` field, groups them under repo headers.
// S176: select-all-PASSED control + count shown above the list.
function renderCandidateListHtml(candidates, showRepoHeaders) {
  if (!candidates || !candidates.length) {
    return '<div class="p">No merge candidates found.</div>';
  }
  var passedCount = candidates.filter(function(c) { return isCandidateReady(c); }).length;
  var html = '<div class="select-all-row">' +
    '<button class="select-all-btn" id="selectAllBtn" type="button">Select all PASSED</button>' +
    '<span class="candidate-count" id="grantCount">' + passedCount + ' ready</span>' +
  '</div>';

  if (showRepoHeaders) {
    // Group by repo
    var byRepo = {};
    var repoOrder = [];
    candidates.forEach(function(c) {
      var r = c.repo || '(unknown)';
      if (!byRepo[r]) { byRepo[r] = []; repoOrder.push(r); }
      byRepo[r].push(c);
    });
    repoOrder.forEach(function(r) {
      html += '<div class="repo-group-header">' + escapeHtml(r) + '</div>';
      html += '<div class="candidate-list">' + byRepo[r].map(candidateRowHtml).join('') + '</div>';
    });
  } else {
    html += '<div class="candidate-list">' + candidates.map(candidateRowHtml).join('') + '</div>';
  }
  return html;
}

function renderGrantCard(user, vat) {
  var repoLabel = _repoParam || FLEET_REPOS.join(' + ');
  var el = document.createElement('div');
  el.className = 'card';
  el.id = 'grantCard';
  el.innerHTML =
    '<div style="font-weight:700;color:#E8EDF5;font-size:16px;margin-bottom:14px;">Grant merge authority to the fleet</div>' +
    '<ul class="scope-list">' +
      '<li><span class="k">repo</span><span class="v">' + escapeHtml(repoLabel) + '</span></li>' +
      '<li><span class="k">action</span><span class="v">merge</span></li>' +
    '</ul>' +
    '<div id="candidateList">' +
      '<div class="loading-state">' +
        '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>' +
        '<span>Loading candidates&hellip; (may take up to 30s)</span>' +
      '</div>' +
    '</div>' +
    '<button class="btn btn-gold" id="grantBtn" type="button" disabled>Grant</button>';
  stageEl.appendChild(el);
  document.getElementById('grantBtn').addEventListener('click', function () {
    grantAuthority(user, vat);
  });
  loadMergeCandidates();
}

// Grant only ever becomes enabled once at least one candidate checkbox is checked — this is
// the DOM-facing mirror of "never send branches:[]" (the API-enforced invariant this whole
// slice exists to satisfy client-side too). S176: also updates button text to show count.
function updateGrantButtonState() {
  var btn = document.getElementById('grantBtn');
  if (!btn) return;
  var boxes = document.querySelectorAll('.candidate-checkbox:checked');
  btn.disabled = boxes.length === 0;
  btn.textContent = boxes.length > 0
    ? 'Grant ' + boxes.length + ' branch' + (boxes.length === 1 ? '' : 'es')
    : 'Grant';
}

// S176: select-all-PASSED — checks every ready candidate and disables all unready ones.
function selectAllPassed() {
  var boxes = document.querySelectorAll('.candidate-checkbox');
  Array.prototype.forEach.call(boxes, function(cb) {
    var row = cb.closest('label');
    var isReady = row && !row.classList.contains('candidate-row-greyed');
    if (isReady) cb.checked = true;
  });
  updateGrantButtonState();
}

// The merge-candidates route may not exist yet on prod (404) or may error — either way,
// render an explicit "unavailable" state and keep Grant disabled rather than falling back
// to any all-branches behavior.
function renderCandidatesUnavailable() {
  var listEl = document.getElementById('candidateList');
  if (listEl) listEl.textContent = 'no candidate list available yet';
  var btn = document.getElementById('grantBtn');
  if (btn) btn.disabled = true;
}

// The route wraps rows in {candidates: [...]}; fall back to treating the payload itself as
// the row array in case a caller (or a future route revision) returns a bare array.
function unwrapCandidates(data) {
  if (Array.isArray(data)) return data;
  return (data && data.candidates) || [];
}

// S176: honours ?repo= — single-repo view if set, both repos grouped if not.
// The inner _fetchOne is intentionally kept inside loadMergeCandidates so that
// source-level checks (pattern tests) find the URL and unwrapCandidates call
// in the same function body as the rest of the loading logic.
function loadMergeCandidates() {
  var listEl = document.getElementById('candidateList');
  var repos = _repoParam ? [_repoParam] : FLEET_REPOS;
  var showHeaders = repos.length > 1;

  function _fetchOne(repo) {
    return fetch(ATHENA_API + '/v1/mac/merge-candidates?repo=' + encodeURIComponent(repo))
      .then(function (r) {
        if (r.status === 404) { renderCandidatesUnavailable(); return null; }
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (!r.ok) throw new Error(errorMessageFromBody(data, r.status));
          return data;
        });
      })
      .then(function (data) {
        if (data === null) return [];
        return unwrapCandidates(data);
      })
      .catch(function () { return []; });
  }

  Promise.all(repos.map(_fetchOne))
    .then(function(results) {
      // Flatten; repo field is preserved per candidate by the backend (S176).
      var all = [];
      results.forEach(function(arr) { if (arr) arr.forEach(function(c) { all.push(c); }); });

      if (!listEl) return;
      listEl.innerHTML = renderCandidateListHtml(all, showHeaders);

      // Wire select-all button
      var saBtn = document.getElementById('selectAllBtn');
      if (saBtn) saBtn.addEventListener('click', selectAllPassed);

      // Wire per-row change handlers
      Array.prototype.forEach.call(document.querySelectorAll('.candidate-checkbox'), function (cb) {
        cb.addEventListener('change', updateGrantButtonState);
      });
      updateGrantButtonState();
    })
    .catch(function () {
      renderCandidatesUnavailable();
    });
}

// S176: group checked boxes by data-repo and make one POST per repo.
// When only one repo is in play (the common single-repo case), this is identical
// to the original behaviour — one call, one permit minted.
function grantAuthority(user, vat) {
  var btn = document.getElementById('grantBtn');
  var checkedBoxes = Array.prototype.filter.call(document.querySelectorAll('.candidate-checkbox'), function (cb) { return cb.checked; });

  // Filtering on data-name/data-sha (not just checked-count) guards against a malformed
  // merge-candidates response — an empty/missing name or sha must never reach the POST body,
  // even if such a row somehow rendered as checked. data-repo falls back to _repoParam or
  // the first fleet repo for rows that predate the S176 repo field.
  var branches = checkedBoxes.map(function (cb) {
    return {
      name: cb.getAttribute('data-name') || '',
      sha:  cb.getAttribute('data-sha')  || '',
      repo: cb.getAttribute('data-repo') || _repoParam || FLEET_REPOS[0]
    };
  }).filter(function (b) { return b.name && b.sha; });

  if (!branches.length) return; // Grant is disabled whenever this is true; defensive no-op

  if (btn) { btn.disabled = true; btn.textContent = 'Granting…'; }

  // Group by repo for per-repo grant calls.
  var byRepo = {};
  branches.forEach(function(b) {
    if (!byRepo[b.repo]) byRepo[b.repo] = [];
    byRepo[b.repo].push({ name: b.name, sha: b.sha });
  });
  var repos = Object.keys(byRepo);
  var nowIso = new Date().toISOString();

  // Fire one POST per repo; all must succeed before we render the result.
  Promise.all(repos.map(function(repo) {
    var body = {
      vat: vat,
      repo: repo,
      branches: byRepo[repo],
      reason: 'granted from /grant by ' + user.email + ' ' + nowIso
    };
    return fetch(ATHENA_API + '/v1/mac/authorizations/by-vat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(errorMessageFromBody(data, r.status));
        return { data: data, repo: repo, branches: byRepo[repo] };
      });
    });
  })).then(function(results) {
    // For single-repo result, use the original renderGrantResult path.
    if (results.length === 1) {
      renderGrantResult(results[0].data, results[0].branches);
    } else {
      renderGrantResultMulti(results);
    }
  }).catch(function (e) {
    renderGrantError((e && e.message) || 'unknown error');
    if (btn) { btn.disabled = false; btn.textContent = 'Grant'; }
  });
}

function renderGrantResult(data, branches) {
  var fields = permitResultFields(data);
  var authorityClass = fields.authorityClass;
  var humanRooted = isHumanRootedAuthority(authorityClass);
  var expiresAt = fields.expiresAt || '(unknown)';
  var permitId = fields.id || '(none)';
  var grantedBranches = branches || [];

  var html = '<div class="card" id="grantResultCard">' +
    '<div style="font-weight:700;color:#E8EDF5;font-size:16px;margin-bottom:4px;">Merge authority granted</div>';

  if (!humanRooted) {
    html += '<div class="warn-box">authority_class is not human-rooted</div>';
  }

  html += '<ul class="attest-list">' +
    '<li><span class="k">permit id</span><span class="v">' + escapeHtml(String(permitId)) + '</span></li>' +
    '<li><span class="k">authority_class</span><span class="v">' + escapeHtml(String(authorityClass || '(none)')) + '</span></li>' +
    '<li><span class="k">expires_at</span><span class="v">' + escapeHtml(String(expiresAt)) + '</span></li>' +
  '</ul>';

  html += '<ul class="attest-list" id="grantedBranchList">' + grantedBranches.map(function (b) {
    return '<li><span class="k">branch</span><span class="v">' + escapeHtml(String(b.name)) + '@' + escapeHtml(shortSha(b.sha)) + '</span></li>';
  }).join('') + '</ul>';

  html += '</div>';

  // grantCard is guaranteed present here — this only runs off the click listener that
  // renderGrantCard itself attached, so the card it's replacing is still in the DOM.
  document.getElementById('grantCard').outerHTML = html;

  setExplain('These ' + grantedBranches.length + ' branches at these exact SHAs may be merged by the fleet before ' + expiresAt + '; any new commit on them needs a new grant.');
}

// S176: multi-repo grant result — shows one permit card per repo.
function renderGrantResultMulti(results) {
  var totalBranches = results.reduce(function(n, r) { return n + r.branches.length; }, 0);
  var html = '<div class="card" id="grantResultCard">' +
    '<div style="font-weight:700;color:#E8EDF5;font-size:16px;margin-bottom:4px;">Merge authority granted (' + results.length + ' repos)</div>';
  results.forEach(function(r) {
    var authorityClass = r.data.authority_class || '';
    var humanRooted = isHumanRootedAuthority(authorityClass);
    if (!humanRooted) {
      html += '<div class="warn-box">authority_class is not human-rooted for ' + escapeHtml(r.repo) + '</div>';
    }
    html += '<ul class="attest-list">' +
      '<li><span class="k">repo</span><span class="v">' + escapeHtml(r.repo) + '</span></li>' +
      '<li><span class="k">permit id</span><span class="v">' + escapeHtml(String(r.data.id || '(none)')) + '</span></li>' +
      '<li><span class="k">expires_at</span><span class="v">' + escapeHtml(String(r.data.expires_at || '(unknown)')) + '</span></li>';
    r.branches.forEach(function(b) {
      html += '<li><span class="k">branch</span><span class="v">' + escapeHtml(b.name) + '@' + escapeHtml(shortSha(b.sha)) + '</span></li>';
    });
    html += '</ul>';
  });
  html += '</div>';
  document.getElementById('grantCard').outerHTML = html;
  setExplain(totalBranches + ' branches across ' + results.length + ' repos granted — any new commit needs a new grant.');
}

function renderGrantError(message) {
  var existing = document.getElementById('grantErrBox');
  if (existing) { existing.remove(); }
  var html = '<div class="err-box" id="grantErrBox">Grant failed: ' + escapeHtml(message) + '</div>';
  document.getElementById('grantCard').insertAdjacentHTML('afterend', html);
  var btn = document.getElementById('grantBtn');
  if (btn) { btn.disabled = false; btn.textContent = 'Grant'; }
  setExplain('The grant request to /v1/mac/authorizations/by-vat failed — no merge authority was created.');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Entity-escaping alone is not enough for an href sink — a javascript: (or other
// non-http(s)) scheme survives entity-escaping untouched. Only allow relative paths
// or explicit http(s) URLs; anything else is dropped rather than rendered as a link.
function sanitizeHref(url) {
  var s = String(url || '');
  if (/^\/(?!\/)/.test(s)) return escapeHtml(s); // same-origin relative path
  if (/^https?:\/\//i.test(s)) return escapeHtml(s);
  return '';
}

// ============================================================
// Mint flow
// ============================================================

// FastAPI validation/auth errors often return `detail` as an object or array
// (pydantic error list), not a string — mirror vac-auth.js's own _api() unwrap
// so those render as readable text instead of "[object Object]".
function errorMessageFromBody(data, status) {
  var msg = (data && (data.detail || data.error)) || ('HTTP ' + status);
  if (typeof msg === 'object') {
    try { return msg.message || JSON.stringify(msg); } catch (e) { return 'HTTP ' + status; }
  }
  return msg;
}

function mintToken(user) {
  var token = VAC.getToken();
  if (!token) { renderGate(false); return; }
  var btn = document.getElementById('mintBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Minting…'; }

  var body = buildIssueBody(user, token);
  fetch(API_BASE + '/v1/vat/issue', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (data) {
      if (!r.ok) throw new Error(errorMessageFromBody(data, r.status));
      return data;
    });
  }).then(function (data) { renderResult(data, user); }).catch(function (e) {
    renderMintError((e && e.message) || 'unknown error');
  });
}

// ============================================================
// Boot
// ============================================================

function checkSessionAndRender() {
  stageEl.innerHTML = '<div class="p">Checking your VAC session…</div>';
  var prior = priorAuthoritySnapshot(localStorage);
  var narration = expiryNarration(prior, Date.now());
  // An aged ceremony blob (>24h) must not be bridged into a session token — auth.html purges
  // it on its own load, but a direct landing here never went through auth.html.
  if (prior.had && prior.ts > 0 && (Date.now() - prior.ts) > AUTHORITY_TTL_MS) {
    try { localStorage.removeItem('vac_verified'); } catch (e) {}
    try { localStorage.removeItem('vac_last_verified'); } catch (e) {}
  }
  bridgeCeremonySession();

  if (typeof VAC === 'undefined') {
    stageEl.innerHTML = '<div class="err-box">VAC auth SDK failed to load.</div>';
    setExplain('vac-auth.js did not load, so the session could not be checked.');
    return;
  }

  VAC.isAuthenticated().then(function (ok) {
    var user = VAC.getUser();
    if (!ok || !user || !user.email) { renderGate(false, narration); return; }
    if (user.auth_level !== 'full') { renderGate(true); return; }
    renderMintCard(user);
  }).catch(function () {
    renderGate(false, narration);
  });
}

checkSessionAndRender();
</script>
</body>
</html>
